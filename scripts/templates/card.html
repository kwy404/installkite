<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>installkite card</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body {
    font-family: "Segoe UI", Inter, Arial, sans-serif;
    color: #12233f;
    background:
      radial-gradient(60vw 40vw at 92% 108%, rgba(255, 138, 61, .55), transparent 70%),
      radial-gradient(40vw 30vw at 0% 0%, rgba(255, 255, 255, .7), transparent 70%),
      linear-gradient(180deg, #bfe6ff 0%, #e3f4ff 58%, #ffe2c8 100%);
    display: grid;
    grid-template-columns: 34vw 1fr;
    align-items: center;
    padding: 0 6vw 0 4vw;
    position: relative;
  }
  .cloud { position: absolute; fill: #fff; }
  .kite { width: 33vw; height: 33vw; margin-top: -2vw; }
  h1 { font-size: 8.2vw; font-weight: 800; letter-spacing: -.25vw; line-height: 1; }
  h1 span { color: #2b8ff0; }
  p { font-size: 2.55vw; color: #3b5579; margin-top: 1.6vw; font-weight: 500; line-height: 1.3; max-width: 52vw; }
  .cmd {
    display: inline-flex; gap: 1.2vw; margin-top: 3vw; padding: 1.5vw 2.2vw; border-radius: 1.4vw;
    background: #12233f; color: #fff; font: 2.1vw "Cascadia Code", Consolas, monospace;
    box-shadow: 0 1.5vw 3vw -1.5vw rgba(18, 35, 63, .55);
  }
  .cmd b { color: #9fd0ff; font-weight: 400; }
  .chips { display: flex; flex-wrap: wrap; gap: .8vw; margin-top: 2.2vw; max-width: 56vw; }
  .chips span { padding: .6vw 1.4vw; border-radius: 99vw; background: rgba(255, 255, 255, .78); border: .12vw solid rgba(43, 143, 240, .35); font-size: 1.55vw; font-weight: 600; color: #3b5579; }
  .url { position: absolute; right: 4vw; bottom: 3vw; font-size: 1.6vw; font-weight: 600; color: #12233f; opacity: .7; }
</style>
</head>
<body>
  <svg class="cloud" style="left:44vw;top:3vw;width:9vw" viewBox="-4 0 80 42"><path d="M10 40 C0 40 -4 26 8 22 C8 8 26 2 34 14 C40 4 60 6 60 22 C72 22 74 40 62 40 Z"/></svg>
  <svg class="cloud" style="left:6vw;bottom:5vw;width:13vw;opacity:.9" viewBox="-4 0 80 42"><path d="M10 40 C0 40 -4 26 8 22 C8 8 26 2 34 14 C40 4 60 6 60 22 C72 22 74 40 62 40 Z"/></svg>
  <img class="kite" src="../../assets/mascot.svg" alt="">
  <main>
    <h1>install<span>kite</span></h1>
    <p>Make any website installable and offline capable with one line.</p>
    <div class="cmd"><b>$</b>npx installkite init</div>
    <div class="chips"><span>web app manifest</span><span>every icon size</span><span>service worker</span><span>offline page</span><span>install button</span><span>iOS sheet</span></div>
  </main>
  <div class="url">kwy404.github.io/installkite</div>
</body>
</html>
